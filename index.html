<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="theme-color" content="#2b3a67">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Maison</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}html{background:#2a3566}
body{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:#1c1c1e;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  background:#3a4a7a;background-image:radial-gradient(circle at 12% 18%,#f7a35c 0%,rgba(247,163,92,0) 38%),radial-gradient(circle at 88% 12%,#c86dd7 0%,rgba(200,109,215,0) 40%),radial-gradient(circle at 70% 85%,#3fb6c6 0%,rgba(63,182,198,0) 42%),radial-gradient(circle at 20% 90%,#5a6fe0 0%,rgba(90,111,224,0) 45%),linear-gradient(160deg,#4b3f86,#24345f);background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto;padding:26px 28px 10px}
.lock{color:#fff;text-align:center;margin:4px 0 22px;text-shadow:0 1px 12px rgba(0,0,0,.15)}
.date{font-size:20px;font-weight:600;opacity:.9}
.clk{font-size:92px;font-weight:700;line-height:1;letter-spacing:-2px;margin-top:2px}
.grid{display:flex;flex-wrap:wrap;margin:0 -9px}
.c1{width:25%;padding:9px}.c2{width:50%;padding:9px}.w.wx2{background:linear-gradient(180deg,#3b78c9 0%,#24539c 100%);color:#fff}
.w{border-radius:26px;padding:16px 18px;height:100%;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 8px 30px rgba(20,20,60,.18);overflow:hidden;position:relative}
.wt{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.link{background:none;border:0;color:#8e8e93;font-size:13px;font-weight:500;padding:0;-webkit-appearance:none;cursor:pointer;text-transform:none;letter-spacing:0}
.wx{background:linear-gradient(180deg,#4a8ad8 0%,#2c64b8 100%);color:#fff}
.wx .city{font-size:15px;font-weight:600}
.wx .t{font-size:52px;font-weight:300;line-height:1.05;margin-top:2px}
.wx .wxi{font-size:26px;margin-top:6px}
.wx .s{font-size:13px;font-weight:600;margin-top:4px;line-height:1.3}
.wx .cs{font-size:12px;opacity:.85;margin-top:2px}
.cal .day{color:#ff3b30;font-size:13px;font-weight:700;text-transform:uppercase}
.cal .num{font-size:40px;font-weight:300;line-height:1;margin:2px 0 8px}
#agenda .row{display:flex;flex-direction:column;padding:2px 0 2px 9px;border-left:3px solid #ff3b30;margin-bottom:8px;font-size:15px;font-weight:600;line-height:1.25}
#agenda .when{font-size:12px;color:#8e8e93;font-weight:500;-webkit-box-ordinal-group:3;order:2}
#agenda .row:nth-child(2n){border-left-color:#007aff}
#agenda .empty{font-size:14px;color:#8e8e93}
.plat{display:flex;align-items:stretch;padding:0 !important}
.thumb{width:44%;min-height:180px;background:linear-gradient(135deg,#ffd27a,#f39c3d);font-size:76px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pinfo{padding:18px 20px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.kick{font-size:13px;font-weight:700;color:#ff9500;text-transform:uppercase;letter-spacing:.3px}
.pn{font-size:22px;font-weight:700;line-height:1.2;margin-top:4px;letter-spacing:-.3px}
.sub{font-size:13px;color:#8e8e93}
.btn{display:inline-block;align-self:flex-start;margin-top:12px;font-size:15px;font-weight:600;padding:8px 18px;border-radius:20px;background:#007aff;color:#fff;text-decoration:none}
.rhead{display:flex;align-items:center;margin-bottom:4px}
.rem .cnt{font-size:30px;font-weight:700;line-height:1}
.rem .ttl{font-size:17px;font-weight:700;margin-left:auto}
.rem.or .ttl,.rem.or .cnt{color:#ff9500}
.rem.bl .ttl,.rem.bl .cnt{color:#007aff}
.list .row{display:flex;align-items:center;padding:7px 0;font-size:16px;border-bottom:1px solid rgba(60,60,67,.12);cursor:pointer}
.list .row:last-child{border-bottom:0}
.box{width:20px;height:20px;border:1.5px solid #c7c7cc;border-radius:50%;margin-right:11px;flex-shrink:0;text-align:center;line-height:17px;font-size:11px;color:#fff;font-weight:700}
.rem.or .row.done .box{background:#ff9500;border-color:#ff9500}
.rem.bl .row.done .box{background:#007aff;border-color:#007aff}
.row.done{color:#aeaeb2}
.empty{color:#8e8e93;font-size:14px;padding:6px 0}
form.add,.inl{display:flex;margin-top:8px}
input{font-size:15px;padding:9px 12px;border:0;border-radius:11px;background:rgba(118,118,128,.12);color:#1c1c1e;-webkit-appearance:none;min-width:0;outline:none}
form.add input,.inl input{flex:1;margin-right:6px}
button{font-size:15px;font-weight:600;padding:9px 14px;border:0;border-radius:11px;background:rgba(118,118,128,.12);color:#007aff;-webkit-appearance:none;cursor:pointer}
form.add button{width:38px;padding:9px 0;font-size:20px;line-height:1}
button.main{background:#007aff;color:#fff}
.bud .big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin-top:4px}
.pbar{height:7px;background:rgba(118,118,128,.16);border-radius:4px;margin-top:10px;overflow:hidden}
.pbar div{height:7px;background:#34c759;border-radius:4px}
.pbar div.over{background:#ff3b30}
.st{font-size:12px;color:rgba(255,255,255,.75);text-align:center;margin-top:12px;padding-bottom:12px}
.st .link{color:rgba(255,255,255,.95);font-size:12px}
.set{margin:9px}
.set label{display:block;font-size:13px;color:#8e8e93;margin:10px 0 6px}
.set input{width:100%}
.sect{color:#fff;font-size:22px;font-weight:700;margin:22px 9px 4px;text-shadow:0 1px 10px rgba(0,0,0,.15)}
.fc{display:flex;margin-top:6px}
.fd{flex:1;text-align:center;font-size:14px;font-weight:600}
.fd .i{font-size:26px;margin:6px 0}
.fd .lo{color:rgba(255,255,255,.7);font-weight:500}
.sun{font-size:13px;margin-top:10px;opacity:.9}
.note textarea{width:100%;min-height:110px;font-family:inherit;font-size:20px;line-height:1.35;border:0;background:transparent;resize:none;color:#3a3000;outline:none;padding:0;-webkit-appearance:none}
.note{background:linear-gradient(180deg,#fff6b8,#ffe98a)}
.note .wt{color:#a07800}
.tm .big{font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 10px;letter-spacing:-1px}
.tm.ring{background:#ff9500;color:#fff}
.tm .pr{display:flex;flex-wrap:wrap;justify-content:center}
.tm .pr button{margin:3px;padding:8px 12px}
.cd .row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(60,60,67,.12)}
.cd .row:last-child{border-bottom:0}
.cd .n{font-size:26px;font-weight:700;color:#af52de;min-width:58px;line-height:1}
.cd .n small{display:block;font-size:11px;font-weight:600;color:#8e8e93}
.cd .tx{flex:1;font-size:16px;font-weight:600;min-width:0}
.cd .x{background:none;color:#c7c7cc;font-size:18px;padding:4px 6px}
.cd form{display:flex;margin-top:8px}
.cd form input{margin-right:6px;min-width:0}
.hide{display:none !important}
#login{max-width:400px;margin:120px auto;text-align:center}
#login input{width:100%;margin:14px 0;text-align:center}
@media (max-width:820px){.c1{width:50%}.c2,.c3{width:100%!important}.clk{font-size:72px}}
</style>
</head>
<body>
<div id="login" class="w hide">
  <div style="font-size:28px;font-weight:700">Maison</div>
  <div class="sub" style="margin-top:6px;font-size:15px">Entre le code d'accès du foyer</div>
  <form id="lf"><input id="lc" autocomplete="off" autocapitalize="none" autocorrect="off" placeholder="maison-…"><button class="main" type="submit" style="width:100%">Valider</button></form>
  <div class="sub" id="lmsg" style="margin-top:10px"></div>
</div>

<div class="wrap hide" id="app">
  <div class="lock"><div class="date" id="date"></div><div class="clk" id="clk">--:--</div></div>

  <div class="grid">
    <div class="c1"><div class="w wx">
      <div class="city" id="wcity">Météo</div>
      <div class="t" id="mt">–</div>
      <div class="wxi" id="mi">⛅</div>
      <div class="s" id="ms"></div>
      <div class="cs" id="mc"></div>
    </div></div>

    <div class="c1"><div class="w cal">
      <div class="day" id="calday"></div>
      <div class="num" id="calnum"></div>
      <div id="agenda"><div class="empty">Chargement…</div></div>
      <div class="sub" id="agup" style="font-size:11px;margin-top:4px"></div>
    </div></div>

    <div class="c2"><div class="w plat">
      <div class="thumb" id="pimg">🍲</div>
      <div class="pinfo">
        <div class="kick">Ce soir</div>
        <div class="pn" id="pn">En attente de la suggestion du jour</div>
        <div class="sub" id="pd" style="margin-top:6px"></div>
        <a class="btn" id="purl" href="#" target="_blank" rel="noopener" style="display:none">Voir la recette</a>
      </div>
    </div></div>

    <div class="c1"><div class="w rem or">
      <div class="rhead"><span class="cnt" id="ncourses">0</span><span class="ttl">Courses</span></div>
      <div class="list" id="l-courses"><div class="empty">Chargement…</div></div>
      <form class="add" data-col="courses"><input placeholder="Ajouter" autocomplete="off"><button type="submit" aria-label="Ajouter">+</button></form>
      <div style="text-align:right;margin-top:6px"><button class="link" type="button" data-clear="courses">Retirer les cochés</button></div>
    </div></div>

    <div class="c1"><div class="w rem bl">
      <div class="rhead"><span class="cnt" id="ntaches">0</span><span class="ttl">Maison</span></div>
      <div class="list" id="l-taches"><div class="empty">Chargement…</div></div>
      <form class="add" data-col="taches"><input placeholder="Ajouter" autocomplete="off"><button type="submit" aria-label="Ajouter">+</button></form>
      <div style="text-align:right;margin-top:6px"><button class="link" type="button" data-clear="taches">Retirer les faites</button></div>
    </div></div>

    <div class="c2"><div class="w bud">
      <div class="wt"><span id="bt">Budget du mois</span><button class="link" type="button" id="bset">Modifier</button></div>
      <div class="big" id="brest">–</div>
      <div class="sub" id="bsub"></div>
      <div class="pbar"><div id="bbar" style="width:0"></div></div>
      <form id="bdep" class="inl"><input id="bdepv" inputmode="decimal" placeholder="Nouvelle dépense (€)"><button type="submit">Ajouter</button></form>
      <form id="btot" class="inl hide"><input id="btotv" inputmode="decimal" placeholder="Budget du mois (€)"><button class="main" type="submit">OK</button></form>
    </div></div>

    <div style="width:100%"><div class="sect">Plus</div></div>

    <div class="c2"><div class="w note">
      <div class="wt"><span>Petit mot</span><span class="sub" id="motup"></span></div>
      <textarea id="mot" placeholder="Laisse un mot à l'autre…"></textarea>
    </div></div>

    <div class="c2"><div class="w wx2">
      <div class="wt" style="color:#fff"><span>Prochains jours</span><span id="wcity2" style="text-transform:none;font-weight:500;opacity:.85"></span></div>
      <div class="fc" id="fc"><div class="fd">–</div></div>
      <div class="sun" id="sun"></div>
    </div></div>

    <div class="c1"><div class="w tm" id="tmw">
      <div class="wt"><span>Minuteur</span></div>
      <div class="big" id="tmv">00:00</div>
      <div class="pr"><button type="button" data-min="5">5 min</button><button type="button" data-min="10">10</button><button type="button" data-min="20">20</button><button type="button" data-min="45">45</button><button type="button" id="tmstop">Stop</button></div>
    </div></div>

    <div class="c3" style="width:75%;padding:9px"><div class="w cd">
      <div class="wt"><span>À venir</span></div>
      <div id="dates"><div class="empty">Chargement…</div></div>
      <form id="df"><input id="dt" placeholder="Vacances, anniversaire…" style="flex:2"><input id="dd" type="date" style="flex:1"><button type="submit">+</button></form>
    </div></div>
  </div>

  <div id="settings" class="w set hide">
    <div style="font-size:17px;font-weight:700">Réglages</div>
    <label for="cv">Ville pour la météo</label>
    <input id="cv" placeholder="Pau">
    <div style="margin-top:12px"><button class="main" id="csave" type="button">Enregistrer</button> <button id="cclose" type="button">Fermer</button> <span id="cmsg" class="sub"></span></div>
  </div>

  <div class="st"><span id="st">Connexion…</span> · <button class="link" type="button" id="sopen">Réglages</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="app.js"></script>
</body>
</html>
