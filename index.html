<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="theme-color" content="#0e1014">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Maison</title>
<style>
:root{--bg:#0e1014;--card:#171a21;--card2:#1d212a;--line:#262b36;--tx:#f2f3f5;--mu:#8d94a1;--blue:#6ea8ff;--green:#4ade80;--amber:#fbbf24;--rose:#fb7185;--violet:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:-apple-system,"SF Pro Display",Helvetica,Arial,sans-serif;color:var(--tx);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 14px;padding-top:max(22px,env(safe-area-inset-top))}
.hero{display:flex;align-items:stretch;margin:0 -7px 0}
.hero>div{padding:0 7px}
.clockbox{flex:1.4;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:6px !important}
.clk{font-size:96px;font-weight:200;line-height:.95;letter-spacing:-3px}
.date{font-size:21px;color:var(--mu);margin-top:8px;font-weight:400}
.date b{color:var(--tx);font-weight:600}
.wx{flex:1}
.wxc{background:linear-gradient(135deg,#1f3a5f 0%,#22324a 55%,#1d212a 100%);border-radius:24px;padding:18px 20px;height:100%;display:flex;align-items:center}
.wxi{font-size:56px;line-height:1;margin-right:16px}
.met .t{font-size:44px;font-weight:300;line-height:1}
.met .s{font-size:15px;color:#c6d3e6;margin-top:6px}
.met .cs{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:#1b1300;background:var(--amber);padding:4px 10px;border-radius:20px}
.met .cs:empty{display:none}
.grid{display:flex;flex-wrap:wrap;margin:14px -7px 0}
.cell{width:50%;padding:7px}
.full{width:100%;padding:7px}
.card{background:var(--card);border-radius:24px;padding:18px 20px;height:100%;border:1px solid var(--line)}
.h{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.tag{display:flex;align-items:center;font-size:15px;font-weight:600;letter-spacing:.2px}
.ic{width:30px;height:30px;border-radius:10px;display:inline-block;text-align:center;line-height:30px;font-size:16px;margin-right:10px}
.ic.b{background:rgba(110,168,255,.16)}.ic.g{background:rgba(74,222,128,.16)}.ic.v{background:rgba(167,139,250,.16)}.ic.a{background:rgba(251,191,36,.16)}
.row{display:flex;align-items:center;padding:9px 0;font-size:18px;cursor:pointer;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.box{width:24px;height:24px;border:2px solid #4a5160;border-radius:50%;margin-right:14px;flex-shrink:0;text-align:center;line-height:20px;font-size:13px;color:#0e1014;font-weight:700}
.row.done{color:#5b6270;text-decoration:line-through}
.row.done .box{background:var(--green);border-color:var(--green)}
.when{min-width:64px;margin-right:10px;font-size:14px;font-weight:600;color:var(--blue);background:rgba(110,168,255,.12);padding:4px 8px;border-radius:8px;text-align:center}
.when.dem{color:var(--mu);background:rgba(141,148,161,.12)}
.empty{color:var(--mu);font-size:15px;padding:6px 0}
form.add{display:flex;margin-top:12px}
input{font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--tx);-webkit-appearance:none;min-width:0;outline:none}
input::placeholder{color:#5b6270}
form.add input{flex:1;margin-right:8px}
button,.btn{font-size:15px;font-weight:600;padding:11px 16px;border:0;border-radius:14px;background:var(--card2);color:var(--tx);-webkit-appearance:none;text-decoration:none;display:inline-block;cursor:pointer}
form.add button{background:var(--tx);color:var(--bg);width:46px;padding:11px 0;font-size:20px;line-height:1}
button.main{background:var(--tx);color:var(--bg)}
.link{background:none;border:0;color:var(--mu);font-size:13px;font-weight:500;padding:0}
.big{font-size:44px;font-weight:300;letter-spacing:-1px;line-height:1.05}
.sub{font-size:14px;color:var(--mu)}
.bar{height:10px;background:var(--card2);border-radius:6px;margin-top:14px;overflow:hidden}
.bar div{height:10px;background:linear-gradient(90deg,var(--violet),var(--blue));border-radius:6px}
.bar div.over{background:var(--rose)}
.inl{margin-top:14px;display:flex}
.inl input{flex:1;margin-right:8px}
.platc{background:linear-gradient(120deg,#3a2a12 0%,#2a2016 45%,var(--card) 100%);border-color:#3a2f1f}
.plat{display:flex;align-items:center}
.thumb{width:96px;height:96px;border-radius:20px;background:rgba(251,191,36,.14);flex-shrink:0;margin-right:18px;overflow:hidden;text-align:center;line-height:96px;font-size:44px}
.thumb img{width:96px;height:96px;object-fit:cover;display:block}
.kick{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
.pn{font-size:24px;font-weight:600;line-height:1.25;margin-top:4px}
.btn.rec{background:var(--amber);color:#1b1300;margin-left:12px;white-space:nowrap}
.st{font-size:12px;color:#5b6270;text-align:center;margin-top:12px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.set{background:var(--card);border-radius:24px;padding:18px 20px;border:1px solid var(--line);margin:7px}
.set label{display:block;font-size:14px;color:var(--mu);margin:10px 0 6px}
.set input{width:100%}
.hide{display:none !important}
#login{max-width:420px;margin:90px auto;background:var(--card);border-radius:24px;padding:28px;border:1px solid var(--line);text-align:center}
#login input{width:100%;margin:16px 0;text-align:center}
@media (max-width:760px){.hero{display:block}.clockbox{padding-bottom:14px !important}.clk{font-size:72px}.cell{width:100%}.wxi{font-size:44px}.met .t{font-size:36px}}
</style>
</head>
<body>
<div id="login" class="hide">
  <div class="big" style="font-size:32px">Maison</div>
  <div class="sub" style="margin-top:8px">Entre le code d'accès du foyer</div>
  <form id="lf"><input id="lc" autocomplete="off" autocapitalize="none" autocorrect="off" placeholder="maison-…"><button class="main" type="submit" style="width:100%">Valider</button></form>
  <div class="sub" id="lmsg" style="margin-top:12px"></div>
</div>

<div class="wrap hide" id="app">
  <div class="hero">
    <div class="clockbox"><div class="clk" id="clk">--:--</div><div class="date" id="date"></div></div>
    <div class="wx"><div class="wxc"><div class="wxi" id="mi">⛅</div><div class="met"><div class="t" id="mt">–</div><div class="s" id="ms"></div><div class="cs" id="mc"></div></div></div></div>
  </div>

  <div class="grid">
    <div class="full"><div class="card platc">
      <div class="plat">
        <div class="thumb" id="pimg">🍽</div>
        <div style="flex:1;min-width:0">
          <div class="kick">Ce soir, on mange</div>
          <div class="pn" id="pn">En attente de la suggestion du jour</div>
          <div class="sub" id="pd" style="margin-top:6px"></div>
        </div>
        <a class="btn rec" id="purl" href="#" target="_blank" rel="noopener" style="display:none">Recette →</a>
      </div>
    </div></div>

    <div class="cell"><div class="card">
      <p class="h"><span class="tag"><span class="ic b">📅</span>Agenda</span><span id="agup" class="sub" style="font-size:12px"></span></p>
      <div id="agenda"><div class="empty">Chargement…</div></div>
    </div></div>

    <div class="cell"><div class="card">
      <p class="h"><span class="tag"><span class="ic g">🛒</span>Courses</span><button class="link" type="button" data-clear="courses">Retirer les cochés</button></p>
      <div id="l-courses"><div class="empty">Chargement…</div></div>
      <form class="add" data-col="courses"><input placeholder="Ajouter un article" autocomplete="off"><button type="submit" aria-label="Ajouter">+</button></form>
    </div></div>

    <div class="cell"><div class="card">
      <p class="h"><span class="tag"><span class="ic a">🏠</span>Maison</span><button class="link" type="button" data-clear="taches">Retirer les faites</button></p>
      <div id="l-taches"><div class="empty">Chargement…</div></div>
      <form class="add" data-col="taches"><input placeholder="Ajouter une tâche" autocomplete="off"><button type="submit" aria-label="Ajouter">+</button></form>
    </div></div>

    <div class="cell"><div class="card">
      <p class="h"><span class="tag"><span class="ic v">💶</span><span id="bt">Budget du mois</span></span><button class="link" type="button" id="bset">Modifier</button></p>
      <div class="big" id="brest">–</div>
      <div class="sub" id="bsub" style="margin-top:4px"></div>
      <div class="bar"><div id="bbar" style="width:0"></div></div>
      <form id="bdep" class="inl"><input id="bdepv" inputmode="decimal" placeholder="Nouvelle dépense (€)"><button type="submit">Ajouter</button></form>
      <form id="btot" class="inl hide"><input id="btotv" inputmode="decimal" placeholder="Budget du mois (€)"><button class="main" type="submit">OK</button></form>
    </div></div>
  </div>

  <div id="settings" class="set hide">
    <p class="h" style="margin:0"><span class="tag">Réglages</span></p>
    <label for="cv">Ville pour la météo</label>
    <input id="cv" placeholder="Pau">
    <div style="margin-top:14px"><button class="main" id="csave" type="button">Enregistrer</button> <button id="cclose" type="button">Fermer</button> <span id="cmsg" class="sub"></span></div>
  </div>

  <div class="st"><span id="st">Connexion…</span> · <button class="link" type="button" id="sopen" style="font-size:12px">Réglages</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="app.js"></script>
</body>
</html>
